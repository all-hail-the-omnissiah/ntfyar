name: Build installers

# - "Run workflow" button: test build, installers attached to the run as an artifact.
# - Pushing a tag like v0.2.0: also creates a draft GitHub release with the installers
#   attached. Review it under Releases and click Publish.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $line = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match the app version v$version in src-tauri/Cargo.toml. Update the version there first."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0

      - name: Build and create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ntfyar ${{ github.ref_name }}
          releaseBody: |
            Download **ntfyar_…_x64-setup.exe** below and run it.

            Windows may show "Windows protected your PC" because the installer isn't code-signed. Click **More info → Run anyway**.
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: ntfyar-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
